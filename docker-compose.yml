services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: procurely
      POSTGRES_PASSWORD: procurely
      POSTGRES_DB: procurely
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U procurely -d procurely']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Dev-only login is enabled only for NODE_ENV=development (or test).
      NODE_ENV: development
      # Restricted role: cannot bypass RLS. Migrations and the seed use DIRECT_URL (owner).
      DATABASE_URL: postgresql://procurely_api:procurely_api@db:5432/procurely
      DIRECT_URL: postgresql://procurely:procurely@db:5432/procurely
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
