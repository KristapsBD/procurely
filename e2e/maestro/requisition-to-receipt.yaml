url: about:blank
name: Requisition to approval to purchase order to goods receipt
---
# Seed story: Megacorp Industries, where requisitions from €500.00 up go to an approver.
# Ivan (requester), Hanna (approver) and Jonas (buyer) take one requisition all the way to
# a closed purchase order. Text fields have no visible placeholder, so they are found by the
# label printed above them.
- evalScript: ${output.tag = 'E2E shelving ' + Date.now()}
- openLink: ${APP_URL}
- extendedWaitUntil:
    visible: 'Sign in as Alice'
    timeout: 120000

- runFlow:
    file: steps/sign-in-as-id.yaml
    env:
      PERSON_ID: '00000000-0000-4000-8000-0000000000b9'
      NAME: Ivan Requester
- assertVisible: 'Megacorp Industries (EUR), you are requester'
- assertNotVisible: 'Inbox'
- assertNotVisible: 'Orders'
# index -1 picks the tab bar button: each tab's screen header repeats its name above it.
- tapOn:
    text: 'Requests'
    index: -1
- tapOn: 'New requisition'
- tapOn: 'PLANT1'
- tapOn:
    below: 'Justification'
- inputText: ${output.tag}
- tapOn: 'Steel shelving unit · €189.00'
- tapOn:
    below: 'Quantity of Steel shelving unit'
- eraseText
- inputText: '4'
- assertVisible: 'Estimated total €756.00'
- tapOn: 'Save draft'
- assertVisible: 'Requested by Ivan Requester.*'
- assertVisible: 'Draft'
- tapOn: 'Submit'
- assertVisible: 'Waiting for a decision'
- assertVisible: 'Waiting for an approver or an admin.'
- runFlow: steps/sign-out.yaml

- runFlow:
    file: steps/sign-in-as-id.yaml
    env:
      PERSON_ID: '00000000-0000-4000-8000-0000000000b8'
      NAME: Hanna Approver
- assertNotVisible: 'Requests'
- tapOn:
    text: 'Inbox'
    index: -1
- assertVisible: ${output.tag}
- tapOn: ${output.tag}
- assertVisible: 'Waiting for you'
- tapOn:
    below: 'Comment'
- inputText: 'Within budget'
- tapOn: 'Approve'
- assertVisible: 'Approved: ${output.tag}'
- runFlow: steps/sign-out.yaml

- runFlow:
    file: steps/sign-in-as-id.yaml
    env:
      PERSON_ID: '00000000-0000-4000-8000-0000000000bd'
      NAME: Jonas Buyer
- assertNotVisible: 'Inbox'
- tapOn:
    text: 'Orders'
    index: -1
- tapOn: 'New purchase order'
- tapOn: '${output.tag} · €756.00'
- tapOn: 'Ferro Industrial Supply'
- tapOn: 'Create purchase order'
- assertVisible: 'Issued'
- assertVisible: '4 ordered × €189.00'
- assertVisible: '0 of 4 received'

- tapOn: 'Record receipt'
- tapOn:
    below: 'Received now of Steel shelving unit'
- inputText: '3'
- tapOn: 'Record delivery'
- assertVisible: 'Partially received'
- assertVisible: '3 of 4 received'
- tapOn: 'Record receipt'
- tapOn:
    below: 'Received now of Steel shelving unit'
- inputText: '1'
- tapOn: 'Record delivery'
- assertVisible: 'Fully received'
- tapOn: 'Close order'
- assertVisible: 'Closed'
- assertVisible: 'Closed by Jonas Buyer on .*'
